name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the workspace libraries (@velix/core, sdk, ui, cli) first so their
      # dist/*.d.ts exist. tauri-action runs its beforeBuildCommand inside
      # apps/desktop, which only builds the desktop package and would otherwise
      # fail to resolve @velix/core on a clean checkout (dist is gitignored).
      - name: Build workspace libraries
        run: pnpm --filter "./packages/**" build

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Velix ${{ github.ref_name }}'
          releaseBody: 'Tải installer Windows (.exe / .msi) ở phần Assets bên dưới.'
          releaseDraft: true
          prerelease: false
