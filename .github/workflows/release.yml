name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    # One leg failing (e.g. macOS) must not cancel the Windows build mid-way.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # Two separate macOS builds rather than one universal binary: each gets
          # its own darwin-* entry in latest.json, which is what the updater looks up.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest is Apple Silicon; the Intel build cross-compiles.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.args }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the workspace libraries (@velix/core, sdk, ui, cli) first so their
      # dist/*.d.ts exist. tauri-action runs its beforeBuildCommand inside
      # apps/desktop, which only builds the desktop package and would otherwise
      # fail to resolve @velix/core on a clean checkout (dist is gitignored).
      - name: Build workspace libraries
        run: pnpm --filter "./packages/**" build

      # The signing keys are what the installed app checks before it will apply
      # an update; without them tauri-action builds unsigned artifacts and the
      # updater rejects every release it is offered.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Velix ${{ github.ref_name }}'
          releaseBody: |
            Tải bản cài ở phần Assets bên dưới:
            - **Windows**: `.exe` (khuyên dùng) hoặc `.msi`
            - **macOS Apple Silicon (M1+)**: `.dmg` có `aarch64`
            - **macOS Intel**: `.dmg` có `x64`

            macOS: bản chưa notarize — lần đầu mở nếu báo "bị hỏng" hoặc "không xác minh được nhà phát triển", chạy `xattr -cr /Applications/Velix.app` rồi mở lại.
          # latest.json is the update feed; it only becomes reachable at
          # /releases/latest/download/ once the draft is published.
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
