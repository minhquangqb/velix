[package]
name = "velix"
version = "0.1.0"
description = "Velix desktop workspace"
edition = "2021"

[lib]
name = "velix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
