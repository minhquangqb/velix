[package]
name = "velix"
version = "0.1.1"
description = "Velix desktop workspace"
edition = "2021"

[lib]
name = "velix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.11.1 is the first release fixing GHSA-7gmj-67g7-phm9, where a remote origin
# could be mistaken for a local one on Windows — exactly our remote-webview setup.
tauri = { version = "2.11.1", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# Keeps a relaunch from starting a doomed second process while Velix sits in the
# tray: the new process hands its arguments over and exits, the live one shows.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opens external links (message links) in the system browser rather than
# letting them navigate the platform webview away and drop its IPC grant.
open = "5"
